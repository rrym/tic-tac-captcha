<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>井字棋 · 在线对战</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #eef2f7;
    --bg-accent: #dbe4f0;
    --surface: #ffffff;
    --surface-2: #f4f6fa;
    --text: #1e2430;
    --text-dim: #6b7280;
    --border: #e3e8f0;
    --x: #2563eb;
    --o: #e11d48;
    --win-bg: #fdf0c8;
    --win-border: #e9c46a;
    --shadow: 0 10px 30px rgba(30, 41, 59, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --bg-accent: #1a2233;
      --surface: #1a2130;
      --surface-2: #222b3e;
      --text: #e8ecf4;
      --text-dim: #8b95a8;
      --border: #2c3750;
      --x: #60a5fa;
      --o: #fb7185;
      --win-bg: rgba(250, 204, 21, .13);
      --win-border: rgba(250, 204, 21, .45);
      --shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1100px 560px at 18% -12%, var(--bg-accent), transparent),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;   /* iOS Safari 地址栏收起/展开时不跳动 */
    display: flex;
    justify-content: center;
    padding: 36px 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: min(92vw, 440px);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .app > * { flex: 0 0 auto; }

  header { text-align: center; }
  h1 {
    font-size: 26px;
    letter-spacing: 2px;
    background: linear-gradient(120deg, var(--x), var(--o));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { margin-top: 6px; font-size: 13px; color: var(--text-dim); }

  .hidden { display: none !important; }

  /* 对局区内部纵向布局与间距（修复棋盘与比分栏贴边/视觉重叠） */
  #game { display: flex; flex-direction: column; gap: 16px; }

  /* ---------- 卡片（大厅 / 等待） ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: center;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .join-row { display: flex; gap: 10px; }
  .join-row input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface-2);
    color: var(--text);
    font-size: 18px;
    letter-spacing: 6px;
    text-align: center;
    text-transform: uppercase;
    font-family: inherit;
    outline: none;
  }
  .join-row input:focus { border-color: var(--x); }
  .hint { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .err { font-size: 13px; color: #dc2626; min-height: 18px; }
  .back { font-size: 13px; }
  .back a { color: var(--x); text-decoration: none; }

  /* 等待房间 */
  .code {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 12px;
    padding-left: 12px; /* 抵消最后一个字符的间距 */
    font-variant-numeric: tabular-nums;
  }
  .link-row { display: flex; gap: 8px; }
  .link-row input {
    flex: 1;
    min-width: 0;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .code-actions { display: flex; gap: 10px; }
  .code-actions .btn { flex: 1; }
  .waiting-text { font-size: 14px; color: var(--text-dim); }
  .spinner {
    display: inline-block;
    width: 13px;
    height: 13px;
    vertical-align: -2px;
    border: 2px solid var(--border);
    border-top-color: var(--x);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 系列赛模式选择 */
  .series-switch {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .seg {
    flex: 1;
    padding: 8px 2px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .seg.active { background: var(--text); color: var(--bg); font-weight: 600; }

  /* ---------- 按钮 ---------- */
  .btn {
    padding: 12px 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .12s, opacity .15s, background .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.97); }
  .btn.primary {
    background: var(--text);
    border-color: var(--text);
    color: var(--bg);
    font-weight: 600;
  }
  .btn.primary:hover { opacity: .9; background: var(--text); }
  .btn.big { font-size: 16px; padding: 14px 0; }

  /* ---------- 对局 ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
  }
  .who { font-weight: 700; }
  .round-no { color: var(--text-dim); font-size: 13px; }
  .btn.small { padding: 7px 14px; font-size: 13px; border-radius: 10px; }

  .status {
    min-height: 26px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 800;
    color: #fff;
  }
  .chip.cx { background: var(--x); }
  .chip.co { background: var(--o); }
  .chip.chip-plain { background: #fff; border: 1px solid var(--border); }
  .chip .chip-piece { width: 15px; height: 15px; display: block; }
  .chip .chip-piece[src] { border-radius: 4px; }   /* 图片版小图章 */

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
  }
  .cell {
    position: relative;
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--cell-tint, var(--surface-2));
    cursor: pointer;
    transition: background .15s, transform .12s, border-color .2s;
    padding: 0;
  }
  .board:not(.locked) .cell:not([data-mark]):hover {
    background: var(--cell-tint-hover, #e9eef6);
    transform: translateY(-1px);
  }
  @media (prefers-color-scheme: dark) {
    .board:not(.locked) .cell:not([data-mark]):hover { background: var(--cell-tint-hover, #2a3550); }
  }
  .board.locked .cell { cursor: default; }

  .piece {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .25s;
  }
  .piece-x { color: var(--x); }
  .piece-o { color: var(--o); }
  /* 图片棋子：白底图做成贴纸卡，避免背景突兀 */
  .piece-img {
    inset: 5%;
    width: 90%;
    height: 90%;
    object-fit: contain;
    padding: 6%;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, .07);
    border-radius: 16%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .14);
  }
  .cell[data-mark="X"] .piece-x,
  .cell[data-mark="O"] .piece-o { opacity: 1; }
  .cell[data-mark="X"] .piece-x { animation: piece-in .34s cubic-bezier(.34, 1.56, .64, 1); }
  .cell[data-mark="O"] .piece-o { animation: piece-in .34s cubic-bezier(.34, 1.56, .64, 1) .06s; }
  @keyframes piece-in {
    from { transform: scale(.3); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* 主题棋盘底色（浅淡不抢戏，深色模式同款色系加深） */
  .board[data-theme="tea"]      { --cell-tint: #f6efe4; --cell-tint-hover: #ede2d0; }
  .board[data-theme="chiikawa"] { --cell-tint: #fbf5e0; --cell-tint-hover: #f3ead0; }
  @media (prefers-color-scheme: dark) {
    .board[data-theme="tea"]      { --cell-tint: #2c2820; --cell-tint-hover: #3a3428; }
    .board[data-theme="chiikawa"] { --cell-tint: #2c2a1e; --cell-tint-hover: #393627; }
  }
  .cell.win-cell { background: var(--win-bg); border-color: var(--win-border); }
  .cell.win-cell .piece { transform: scale(1.1); }
  .board.win .cell:not(.win-cell) .piece { opacity: .28; }
  .board.my-turn {
    border-color: var(--x);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .15), var(--shadow);
  }

  /* ---------- 比分栏（对战式：左右大卡 + 中间平局徽章） ---------- */
  .scoreboard {
    display: flex;
    align-items: stretch;
    gap: 10px;
  }
  .score-card {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    transition: border-color .25s, box-shadow .25s;
  }
  .score-card .score-name { font-size: 13px; color: var(--text-dim); font-weight: 600; }
  .score-card .score-num { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .score-card.me.lead { border-color: var(--x); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
  .score-card.opp.lead { border-color: var(--o); box-shadow: 0 0 0 3px rgba(225, 29, 48, .12); }
  .score-mid {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }
  .score-mid .score-label { font-size: 11px; color: var(--text-dim); }
  .score-mid .score-draw {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-dim);
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--border);
    border-radius: 50%;
    font-variant-numeric: tabular-nums;
  }
  .score-num.pop, .score-draw.pop { animation: score-pop .35s ease-out; }
  @keyframes score-pop { 40% { transform: scale(1.4); } }

  /* 连胜徽章（≥2 连胜显示） */
  .streak {
    display: inline-block;
    margin-left: 5px;
    padding: 1px 8px;
    border-radius: 99px;
    background: linear-gradient(90deg, #f59e0b, #ef4444);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    vertical-align: 1px;
    animation: streak-in .3s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes streak-in { from { transform: scale(0); } to { transform: scale(1); } }

  /* 胜利彩带画布 */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  /* 落子涟漪 */
  .cell.ripple::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 15px;
    border: 2px solid var(--text);
    opacity: 0;
    pointer-events: none;
    animation: ripple .45s ease-out forwards;
  }
  .cell[data-mark="X"].ripple::after { border-color: var(--x); }
  .cell[data-mark="O"].ripple::after { border-color: var(--o); }
  @keyframes ripple {
    from { transform: scale(.55); opacity: .85; }
    to   { transform: scale(1.28); opacity: 0; }
  }

  /* 系列赛进度点（BO3/BO5 时显示） */
  .series-progress {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .series-progress .pips { display: flex; gap: 4px; }
  .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
  .pip.on-me { background: var(--x); }
  .pip.on-opp { background: var(--o); }
  .vs-sep { font-size: 10px; color: var(--text-dim); margin: 0 5px; }

  /* ---------- 快捷消息（仅表情与固定短语，无文字输入） ---------- */
  .chat-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px;
    scrollbar-width: none;
  }
  .chat-bar::-webkit-scrollbar { display: none; }
  .chat-btn {
    flex: 0 0 auto;
    padding: 7px 13px;
    border: 1px solid var(--border);
    border-radius: 99px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .chat-btn:hover { background: var(--surface-2); }
  .chat-btn:active { transform: scale(.94); }
  .chat-stack {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 50;
    pointer-events: none;
    width: max-content;
    max-width: 86vw;
  }
  .chat-bubble {
    background: var(--text);
    color: var(--bg);
    padding: 9px 18px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 600;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    animation: bubble-in .22s ease-out;
    transition: opacity .25s, transform .25s;
  }
  .chat-bubble.out { opacity: 0; transform: translateY(-6px); }
  @keyframes bubble-in {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: none; }
  }

  .actions { display: flex; gap: 10px; }
  .modal .actions .btn { flex: 1; }   /* 弹窗内两按钮等宽平分，整体居中 */

  /* ---------- 结果弹窗 ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 32, .55);
    -webkit-backdrop-filter: blur(4px);   /* iOS Safari 前缀 */
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 10;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: min(86vw, 320px);
    padding: 30px 24px 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
    text-align: center;
    transform: translateY(14px) scale(.95);
    transition: transform .28s cubic-bezier(.34, 1.4, .64, 1);
  }
  .modal-overlay.show .modal { transform: none; }
  .result-emoji { font-size: 48px; line-height: 1; }
  .result-title { margin: 14px 0 4px; font-size: 24px; }
  .result-sub { font-size: 13px; color: var(--text-dim); }
  .modal .actions { margin-top: 20px; }

  /* ---------- 小屏手机适配 ---------- */
  @media (max-width: 380px) {
    .topbar { flex-wrap: wrap; row-gap: 8px; }
    .who { font-size: 13px; }
    .round-no { font-size: 12px; }
    .status { font-size: 15px; }
    .score-card { padding: 10px 12px; }
    .score-card .score-num { font-size: 20px; }
    .chat-btn { padding: 6px 11px; font-size: 12px; }
    .btn.small { padding: 6px 10px; font-size: 12px; }
    .code { font-size: 32px; letter-spacing: 9px; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>井字棋 · 在线对战</h1>
    <p class="subtitle">创建房间，把链接发给朋友，浏览器直连（P2P）</p>
  </header>

  <!-- 大厅 -->
  <section class="card" id="lobby">
    <button class="btn primary big" id="createBtn">🔗 创建房间</button>
    <div class="divider">或输入房间码加入</div>
    <div class="join-row">
      <input id="codeInput" maxlength="4" placeholder="ABCD" autocomplete="off">
      <button class="btn" id="joinBtn">加入</button>
    </div>
    <div class="series-switch" role="radiogroup" aria-label="对局模式（房主选择，加入方跟随）">
      <button type="button" class="seg active" data-series="0">无限对局</button>
      <button type="button" class="seg" data-series="2">三局两胜</button>
      <button type="button" class="seg" data-series="3">五局三胜</button>
    </div>
    <p class="hint">无需服务器与账号：房间码由 WebRTC 信令服务撮合，落子数据在两位玩家浏览器之间直连传输。</p>
    <p class="err" id="lobbyErr"></p>
  </section>

  <!-- 等待对方 -->
  <section class="card hidden" id="waiting">
    <p class="hint">把房间码或链接发给对方</p>
    <div class="code" id="roomCode">----</div>
    <div class="link-row">
      <input id="shareLink" readonly>
      <button class="btn small" id="copyBtn" style="flex:0 0 auto;">复制链接</button>
    </div>
    <div class="code-actions">
      <button class="btn small" id="copyCodeBtn">复制房间码</button>
      <button class="btn small hidden" id="shareBtn">📤 分享邀请</button>
    </div>
    <p class="waiting-text"><span class="spinner"></span> 等待对方加入…</p>
    <button class="btn" id="cancelBtn">取消</button>
  </section>

  <!-- 对局 -->
  <section class="hidden" id="game">
    <div class="topbar">
      <span class="who" id="who"></span>
      <span class="round-no" id="roundNo"></span>
      <button class="btn small" id="muteBtn" title="音效开关">🔊</button>
      <button class="btn small" id="leaveBtn">离开</button>
    </div>
    <div class="status" id="status"></div>
    <section class="board" id="board" aria-label="井字棋棋盘"></section>

    <section class="scoreboard">
      <div class="score-card me" id="scoreCardMe">
        <span class="score-name">你<span class="streak hidden" id="streakMe"></span></span>
        <span class="score-num" id="scoreMe">0</span>
      </div>
      <div class="score-mid">
        <span class="score-label">平局</span>
        <span class="score-draw" id="scoreDraw">0</span>
      </div>
      <div class="score-card opp" id="scoreCardOpp">
        <span class="score-num" id="scoreOpp">0</span>
        <span class="score-name"><span class="streak hidden" id="streakOpp"></span>对方</span>
      </div>
    </section>
    <div class="series-progress hidden" id="seriesProgress"></div>

    <div class="chat-bar" id="chatBar" aria-label="快捷消息"></div>

    <div class="actions">
      <button class="btn primary hidden" id="rematchBtn">再来一局（换先手）</button>
    </div>
  </section>
</main>

<!-- 快捷消息气泡栈（最多保留 3 条，自动淡出） -->
<div class="chat-stack" id="chatStack"></div>

<!-- 结果弹窗 -->
<div class="modal-overlay" id="resultModal" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="result-emoji" id="resultEmoji"></div>
    <h2 class="result-title" id="resultTitle"></h2>
    <p class="result-sub" id="resultSub"></p>
    <div class="actions">
      <button class="btn primary" id="modalAgain">再来一局</button>
      <button class="btn" id="modalClose">查看棋盘</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="./online-core.js"></script>
<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const CODE_RE = new RegExp('^[' + TTTOnline.CODE_CHARS + ']{4}$');
  const PEER_PREFIX = 'tttc-v1-';

  /* ---------- 棋子主题：每次打开随机一套，对局期间不变 ----------
     X 方恒为蓝色调、O 方恒为红色调；形状 + 颜色双重区分，保证识别清晰 */
  const THEMES = [
    {
      board: '',
      x: '<g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round">' +
         '<line x1="27" y1="27" x2="73" y2="73"/><line x1="73" y1="27" x2="27" y2="73"/></g>',
      o: '<circle cx="50" cy="50" r="26" fill="none" stroke="currentColor" stroke-width="10"/>',
    },
    {
      board: 'tea',   // 奶茶系列：图片池每场随机抽两张当 X / O
      pool: [
        'assets/drink1.jpg', 'assets/drink2.jpg', 'assets/drink3.jpg', 'assets/drink4.jpg',
        'assets/drink5.jpg', 'assets/drink6.jpg', 'assets/drink7.jpg',
      ],
    },
    {
      board: 'chiikawa',   // 吉伊卡哇系列：图片池随机抽两张
      pool: ['assets/chiikawa1.jpg', 'assets/chiikawa2.jpg', 'assets/chiikawa3.jpg'],
    },
  ];
  let themeIndex = Math.floor(Math.random() * THEMES.length);
  let theme = THEMES[themeIndex];

  // 从图片池抽两张不同的图（X 用第一张，O 用第二张）
  function pickPair(t) {
    if (!t.pool) return null;
    const i = Math.floor(Math.random() * t.pool.length);
    let j = Math.floor(Math.random() * (t.pool.length - 1));
    if (j >= i) j++;
    return [t.pool[i], t.pool[j]];
  }
  let pair = pickPair(theme);

  const pieceHtml = () => {
    if (theme.pool) {
      return `<img class="piece piece-img piece-x" src="${pair[0]}" alt="">` +
             `<img class="piece piece-img piece-o" src="${pair[1]}" alt="">`;
    }
    return `<svg class="piece piece-x" viewBox="0 0 100 100" aria-hidden="true">${theme.x}</svg>` +
           `<svg class="piece piece-o" viewBox="0 0 100 100" aria-hidden="true">${theme.o}</svg>`;
  };

  // 房主把主题（含奶茶系列的抽图结果）同步给加入方，双方显示同一套棋子
  function applyTheme(idx, pairData) {
    if (!THEMES[idx]) return;
    themeIndex = idx;
    theme = THEMES[idx];
    pair = Array.isArray(pairData) && pairData.length === 2 ? pairData : pickPair(theme);
    $('board').dataset.theme = theme.board;
    cells.forEach(c => { c.innerHTML = pieceHtml(); });   // data-mark 仍在，替换后棋子重新弹入
    if (session) render(session.getState());              // 刷新状态栏里的小图章
  }

  // 状态栏/顶栏的小图章也用当前主题的角色，一眼认出自己是谁
  const chip = m => {
    if (theme.pool) {
      return `<span class="chip chip-plain"><img class="chip-piece" src="${m === 'X' ? pair[0] : pair[1]}" alt=""></span>`;
    }
    return `<span class="chip ${m === 'X' ? 'cx' : 'co'}">` +
      `<svg class="chip-piece" viewBox="0 0 100 100" aria-hidden="true">${m === 'X' ? theme.x : theme.o}</svg></span>`;
  };

  // 图片缺失兜底（如部署环境没带 assets）：棋子退回经典 ✕○、图章退回字母，保证永远可玩
  const FALLBACK_SVG = m =>
    `<svg class="piece piece-${m === 'X' ? 'x' : 'o'}" viewBox="0 0 100 100" aria-hidden="true">${THEMES[0][m === 'X' ? 'x' : 'o']}</svg>`;
  document.addEventListener('error', e => {
    const t = e.target;
    if (!t || t.tagName !== 'IMG') return;
    if (t.classList.contains('piece')) {
      const html = FALLBACK_SVG(t.classList.contains('piece-x') ? 'X' : 'O');
      t.outerHTML = html;
    } else if (t.classList.contains('chip-piece')) {
      t.replaceWith(document.createTextNode(t.getAttribute('src') === pair[0] ? 'X' : 'O'));
    }
  }, true);

  let peer = null, conn = null, session = null;
  let isHost = false;
  let hasOpponent = false;               // 已有对手连接（防并发加入竞态）
  let wins = 0, draws = 0, losses = 0;   // 本次连接内的战绩
  let myStreak = 0, oppStreak = 0;       // 连胜计数（平局/输局即熄灭）
  let chosenSeries = 0;                  // 房主在大厅选择的系列赛目标（0 = 无限对局）
  let seriesTarget = 0;                  // 本场系列赛目标（由房主连接后下发）
  let seriesEnded = false;               // 系列赛是否已分出冠军
  let prevBoard = [];                    // 上一帧棋盘：定位新落子格（涟漪 + 音效）
  let pendingSelfSound = false;          // 本方落子音效由点击处直接播，渲染层跳过
  let chatRound = -1;                    // 表情栏当前对应的局号（每局洗牌一次）

  /* ---------- 界面切换 ---------- */
  const show = (id, on) => $(id).classList.toggle('hidden', !on);
  const lobbyErr = t => { $('lobbyErr').textContent = t || ''; };

  function backToLobby() {
    cleanup();
    show('lobby', true); show('waiting', false); show('game', false);
    $('resultModal').classList.remove('show');
  }

  function cleanup() {
    try { if (conn) conn.close(); } catch (e) {}
    try { if (peer) peer.destroy(); } catch (e) {}
    conn = null; peer = null; session = null;
    hasOpponent = false; seriesEnded = false;
    prevBoard = []; pendingSelfSound = false; chatRound = -1;
    myStreak = 0; oppStreak = 0;
  }

  /* ---------- 音效（WebAudio 现场合成，零素材；🔊 一键静音） ---------- */
  let audioCtx = null;
  let muted = false;
  try { muted = localStorage.getItem('tttc-muted') === '1'; } catch (e) {}

  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, when, dur, type, vol) {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const sfx = {
    move(mine) { ensureAudio(); tone(mine ? 560 : 420, 0, 0.09, 'triangle', 0.05); },
    win()  { ensureAudio(); [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.18, 'triangle', 0.06)); },
    lose() { ensureAudio(); tone(330, 0, 0.22, 'sawtooth', 0.035); tone(220, 0.18, 0.32, 'sawtooth', 0.035); },
    draw() { ensureAudio(); tone(440, 0, 0.16, 'sine', 0.05); tone(440, 0.2, 0.22, 'sine', 0.05); },
    chat() { ensureAudio(); tone(880, 0, 0.06, 'sine', 0.04); },
    join() { ensureAudio(); tone(392, 0, 0.12, 'triangle', 0.05); tone(523, 0.12, 0.2, 'triangle', 0.05); },
  };
  document.addEventListener('pointerdown', ensureAudio, { once: true });

  /* ---------- 胜利彩带（canvas 粒子，撒完自动清理） ---------- */
  function confetti(count) {
    const canvas = document.createElement('canvas');
    canvas.className = 'confetti';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.scale(dpr, dpr);
    const colors = ['#2563eb', '#e11d48', '#f59e0b', '#10b981', '#8b5cf6', '#fbbf24'];
    const parts = [];
    for (let i = 0; i < count; i++) {
      parts.push({
        x: Math.random() * innerWidth,
        y: -20 - Math.random() * innerHeight * 0.4,
        w: 6 + Math.random() * 5,
        h: 8 + Math.random() * 6,
        vx: (Math.random() - 0.5) * 2.2,
        vy: 2.2 + Math.random() * 3,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.25,
        color: colors[Math.floor(Math.random() * colors.length)],
      });
    }
    const start = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      let alive = 0;
      for (const p of parts) {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.vx += Math.sin(now / 300 + p.y / 40) * 0.04;   // 轻微左右飘
        if (p.y < innerHeight + 30) alive++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (alive > 0 && now - start < 4000) requestAnimationFrame(frame);
      else canvas.remove();
    })(start);
  }

  /* ---------- 棋盘渲染 ---------- */
  $('board').dataset.theme = theme.board;   // 棋盘配色跟随主题
  const cells = Array.from({ length: 9 }, (_, i) => {
    const btn = document.createElement('button');
    btn.className = 'cell';
    btn.setAttribute('aria-label', `第 ${i + 1} 格`);
    btn.innerHTML = pieceHtml();
    btn.addEventListener('click', () => {
      if (session && session.getState().myTurn) {
        if (session.onLocalMove(i)) { pendingSelfSound = true; sfx.move(true); }
      }
    });
    $('board').appendChild(btn);
    return btn;
  });

  function ripple(cell) {
    cell.classList.remove('ripple');
    void cell.offsetWidth;   // 强制 reflow 以重启动画
    cell.classList.add('ripple');
  }

  function render(st) {
    if (!st.over) $('resultModal').classList.remove('show');   // 对方重开新局时，收掉本方结果弹窗
    st.board.forEach((m, i) => {
      if (m) cells[i].dataset.mark = m;
      else delete cells[i].dataset.mark;
      cells[i].classList.toggle('win-cell', !!(st.over && st.line && st.line.includes(i)));
    });
    $('board').classList.toggle('win', !!(st.over && st.line));
    $('board').classList.toggle('locked', st.over || !st.myTurn);
    $('board').classList.toggle('my-turn', !st.over && st.myTurn);
    $('who').innerHTML = `你执 ${chip(st.myMark)}`;
    $('roundNo').textContent = `第 ${st.round + 1} 局` + (seriesTarget ? ` · BO${seriesTarget * 2 - 1}` : '');
    $('rematchBtn').classList.toggle('hidden', !st.over || seriesEnded);

    // 新一局开始 → 表情栏重新洗牌（顺序每局都不同）
    if (st.round !== chatRound) {
      chatRound = st.round;
      renderChatBar();
    }

    // 新落子检测：涟漪 + 音效（本方音效由点击处直接播，跳过）
    let placedIdx = -1;
    for (let i = 0; i < 9; i++) {
      if (st.board[i] && !prevBoard[i]) { placedIdx = i; break; }
    }
    prevBoard = st.board.slice();
    if (placedIdx >= 0) {
      ripple(cells[placedIdx]);
      if (pendingSelfSound) pendingSelfSound = false;
      else sfx.move(false);
    }

    const statusEl = $('status');
    if (st.over) {
      statusEl.innerHTML = st.winner
        ? (st.winner === st.myMark ? '🎉 你赢了！' : '对方获胜')
        : '🤝 平局！';
    } else {
      statusEl.innerHTML = st.myTurn
        ? `轮到你落子 ${chip(st.myMark)}`
        : `等待对方落子…（对方 ${chip(st.myMark === 'X' ? 'O' : 'X')}）`;
    }
  }

  function updateScore(popSide) {
    const meEl = $('scoreMe'), drawEl = $('scoreDraw'), oppEl = $('scoreOpp');
    meEl.textContent = wins;
    drawEl.textContent = draws;
    oppEl.textContent = losses;
    $('scoreCardMe').classList.toggle('lead', wins > losses);
    $('scoreCardOpp').classList.toggle('lead', losses > wins);

    // 连胜徽章（≥2 连胜显示，被平局/失利打断即消失）
    const sMe = $('streakMe'), sOpp = $('streakOpp');
    sMe.textContent = myStreak >= 2 ? '🔥 ' + myStreak : '';
    sOpp.textContent = oppStreak >= 2 ? '🔥 ' + oppStreak : '';
    sMe.classList.toggle('hidden', myStreak < 2);
    sOpp.classList.toggle('hidden', oppStreak < 2);

    if (popSide) {   // 得分数字跳动动画
      const el = popSide === 'me' ? meEl : popSide === 'opp' ? oppEl : drawEl;
      el.classList.remove('pop');
      void el.offsetWidth;   // 强制 reflow 以重启动画
      el.classList.add('pop');
    }
    renderSeriesProgress();
  }

  function renderSeriesProgress() {
    const el = $('seriesProgress');
    if (!seriesTarget) { el.classList.add('hidden'); el.innerHTML = ''; return; }
    let html = '<span class="pips">';
    for (let i = 0; i < seriesTarget; i++) html += `<span class="pip ${i < wins ? 'on-me' : ''}"></span>`;
    html += '</span><span class="vs-sep">VS</span><span class="pips">';
    for (let i = 0; i < seriesTarget; i++) html += `<span class="pip ${i < losses ? 'on-opp' : ''}"></span>`;
    html += '</span>';
    el.classList.remove('hidden');
    el.innerHTML = html;
  }

  function showResult(e) {
    if (e.draw) {
      draws++;
      $('resultEmoji').textContent = '🤝';
      $('resultTitle').textContent = '平局！';
    } else if (e.iWon) {
      wins++;
      $('resultEmoji').textContent = '🎉';
      $('resultTitle').textContent = '你赢了！';
    } else {
      losses++;
      $('resultEmoji').textContent = '😅';
      $('resultTitle').textContent = '对方获胜';
    }
    const popSide = e.draw ? 'draw' : e.iWon ? 'me' : 'opp';
    if (e.draw) {
      myStreak = 0; oppStreak = 0;
      sfx.draw();
    } else if (e.iWon) {
      myStreak++; oppStreak = 0;
      sfx.win();
      confetti(130);                        // 赢一局撒一波
    } else {
      oppStreak++; myStreak = 0;
      sfx.lose();
    }
    updateScore(popSide);

    // 系列赛（BO3/BO5）：达到目标胜场 → 冠军弹窗（替代单局弹窗）
    if (seriesTarget > 0 && (wins >= seriesTarget || losses >= seriesTarget)) {
      seriesEnded = true;
      const iWonSeries = wins >= seriesTarget;
      $('resultEmoji').textContent = iWonSeries ? '🏆' : '🎖️';
      $('resultTitle').textContent = iWonSeries ? '胜利！' : '落败';
      $('resultSub').textContent = `最终比分 你 ${wins} : ${losses} 对方（平 ${draws} 局）`;
      $('modalAgain').textContent = '再来一场';
      $('rematchBtn').classList.add('hidden');
      if (iWonSeries) confetti(320);        // 夺冠大撒一波
    } else {
      $('modalAgain').textContent = '再来一局';
      const st = session ? session.getState() : null;
      const next = st && st.myMark === 'X' ? 'O' : 'X';
      $('resultSub').textContent =
        `战绩：你 ${wins} 胜 · 平 ${draws} · 对方 ${losses} 胜 · 下一局你执 ${next}`;
    }
    $('resultModal').classList.add('show');
  }

  /* ---------- 快捷消息（仅表情与固定短语，无文字输入；每局随机洗牌） ---------- */
  const CHATS = [
    { id: 'haha',   label: '😂 哈哈哈' },
    { id: 'just',   label: '🤔 就这？' },
    { id: 'easy',   label: '😎 稳了' },
    { id: 'please', label: '🙏 手下留情' },
    { id: 'faster', label: '⚡ 快点快点' },
    { id: 'nice',   label: '🤝 打得不错' },
    { id: 'devil',  label: '😈 你完了' },
    { id: 'think',  label: '🧠 让我想想' },
    { id: 'sleep',  label: '😴 睡着了？' },
    { id: 'tea',    label: '🍵 喝口茶慢慢下' },
  ];
  let lastChatSentAt = 0, lastChatRecvAt = 0;

  function toastChat(text) {
    const stack = $('chatStack');
    const b = document.createElement('div');
    b.className = 'chat-bubble';
    b.textContent = text;
    stack.appendChild(b);
    while (stack.children.length > 3) stack.removeChild(stack.firstChild);   // 最多保留 3 条
    setTimeout(() => {
      b.classList.add('out');
      setTimeout(() => b.remove(), 300);
    }, 4000);
  }

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 每局重新洗牌渲染，让顺序每次看起来都不一样
  function renderChatBar() {
    const bar = $('chatBar');
    bar.innerHTML = '';
    shuffled(CHATS).forEach(c => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chat-btn';
      b.textContent = c.label;
      b.addEventListener('click', () => {
        const now = Date.now();
        if (!conn || !conn.open || now - lastChatSentAt < 1500) return;  // 发送冷却 1.5s 防刷屏
        lastChatSentAt = now;
        conn.send({ type: 'chat', id: c.id });
        toastChat('你：' + c.label);
      });
      bar.appendChild(b);
    });
  }

  function handleChatMsg(d) {
    const c = CHATS.find(x => x.id === d.id);
    if (!c) return;
    const now = Date.now();
    if (now - lastChatRecvAt < 800) return;                            // 接收冷却 0.8s
    lastChatRecvAt = now;
    sfx.chat();
    toastChat('对方：' + c.label);
  }

  /* ---------- 开始对局（连接建立后调用） ---------- */
  function startSession() {
    show('lobby', false); show('waiting', false); show('game', true);
    lobbyErr('');
    wins = 0; draws = 0; losses = 0;
    myStreak = 0; oppStreak = 0;
    seriesEnded = false;
    prevBoard = [];
    chatRound = -1;
    if (isHost) seriesTarget = chosenSeries;   // 房主生效自己的选择；加入方等待 config 消息
    updateScore();
    setTimeout(() => {
      toastChat('👋 对手已就位，开始！');
      sfx.join();
    }, 400);
    session = TTTOnline.createSession({
      isHost,
      send: m => { if (conn && conn.open) conn.send(m); },
      onEvent: e => {
        if (e.type === 'state') render(e.state);
        else if (e.type === 'result') showResult(e);
      },
    });
  }

  /* ---------- 连接 ---------- */
  function wireConn() {
    conn.on('open', () => {
      if (hasOpponent) return;                 // 防抖：重复 open
      hasOpponent = true;
      if (isHost) {
        // 下发系列赛配置、棋子主题与奶茶系列的抽图结果
        conn.send({ type: 'config', series: chosenSeries, theme: themeIndex, pair: pair || undefined });
      }
      startSession();
    });
    conn.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.type === 'chat') handleChatMsg(d);            // 快捷消息：页面层处理
      else if (d.type === 'config' && !isHost) {
        applySeries(d.series);
        applyTheme(d.theme, d.pair);   // 跟随房主的棋子主题与抽图
      }
      else if (d.type === 'series-reset') resetSeriesScores();
      else if (session) session.onRemoteMsg(d);           // 棋局消息进状态机
    });
    conn.on('close', onConnClosed);
    conn.on('error', onConnClosed);
    if (!isHost) {
      // 加入侧兜底：信令通了但 P2P 通道建不起来时提示
      setTimeout(() => {
        if (!session) {
          lobbyErr('连接超时：请确认房间码正确、房主页面仍开着；若多次失败可能是网络环境限制了 P2P 直连');
          backToLobby();
        }
      }, 15000);
    }
  }

  function onConnClosed() {
    if (!session && !isHost) {
      // 尚未开赛连接就断了：多半是房主取消了房间，别让加入方干等超时
      lobbyErr('连接中断：房主可能取消了房间');
      backToLobby();
      return;
    }
    onPeerLeft();
  }

  function onPeerLeft() {
    if (!session) return;
    session = null;
    $('board').classList.add('locked');
    $('board').classList.remove('my-turn');
    $('status').innerHTML = '对方已离开';
    $('rematchBtn').classList.add('hidden');
    $('resultModal').classList.remove('show');
  }

  /* ---------- 房主：创建房间 ---------- */
  function createRoom(retry) {
    if (typeof Peer === 'undefined') {
      lobbyErr('网络组件加载失败：请检查网络后刷新页面重试');
      return;
    }
    cleanup();
    isHost = true;
    const code = TTTOnline.randomRoomCode(4);
    peer = new Peer(PEER_PREFIX + code, { debug: 1 });

    peer.on('open', () => {
      show('lobby', false); show('waiting', true);
      $('roomCode').textContent = code;
      $('shareLink').value = location.origin + location.pathname + '?room=' + code;
    });
    peer.on('connection', c => {
      if (hasOpponent || (conn && conn.open)) { c.close(); return; }   // 已有对手（含握手中的）→ 拒绝，修复并发加入竞态
      if (conn && !conn.open) { try { conn.close(); } catch (e) {} }   // 丢弃未完成握手的旧连接
      conn = c;
      wireConn();
    });
    peer.on('error', e => {
      if (e.type === 'unavailable-id' && retry > 0) { createRoom(retry - 1); } // 房间码撞了，换一个
      else if (!session) { lobbyErr('网络错误：' + e.type); backToLobby(); }
    });
  }

  /* ---------- 加入方 ---------- */
  function joinRoom(code) {
    if (typeof Peer === 'undefined') {
      lobbyErr('网络组件加载失败：请检查网络后刷新页面重试');
      return;
    }
    cleanup();
    isHost = false;
    show('lobby', true); show('waiting', false);
    lobbyErr('连接中…');
    peer = new Peer({ debug: 1 });
    peer.on('open', () => {
      conn = peer.connect(PEER_PREFIX + code, { reliable: true });
      wireConn();
    });
    peer.on('error', e => {
      if (e.type === 'peer-unavailable') lobbyErr('房间不存在，或房主已关闭页面');
      else lobbyErr('网络错误：' + e.type);
    });
  }

  /* ---------- 事件绑定 ---------- */
  $('createBtn').addEventListener('click', () => createRoom(3));
  $('cancelBtn').addEventListener('click', backToLobby);
  $('leaveBtn').addEventListener('click', backToLobby);

  // 系列赛模式（仅房主的选择生效，加入方通过 config 消息跟随）
  document.querySelectorAll('.seg').forEach(btn => btn.addEventListener('click', () => {
    document.querySelector('.seg.active').classList.remove('active');
    btn.classList.add('active');
    chosenSeries = Number(btn.dataset.series) || 0;
  }));
  function applySeries(n) { seriesTarget = Number(n) || 0; }
  function resetSeriesScores() {
    wins = 0; draws = 0; losses = 0;
    seriesEnded = false;
    updateScore();
  }

  // 静音开关（偏好持久化）
  const muteBtnEl = $('muteBtn');
  muteBtnEl.textContent = muted ? '🔇' : '🔊';
  muteBtnEl.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem('tttc-muted', muted ? '1' : '0'); } catch (e) {}
    muteBtnEl.textContent = muted ? '🔇' : '🔊';
  });

  $('joinBtn').addEventListener('click', () => {
    const code = $('codeInput').value.trim().toUpperCase();
    if (!CODE_RE.test(code)) { lobbyErr('请输入 4 位房间码（字母 I L O 和数字 0 1 除外）'); return; }
    joinRoom(code);
  });
  $('codeInput').addEventListener('input', () => lobbyErr(''));
  $('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });

  function copyText(text, btn, normalText) {
    const done = () => {
      btn.textContent = '已复制 ✓';
      setTimeout(() => { btn.textContent = normalText; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }
  $('copyBtn').addEventListener('click', () => copyText($('shareLink').value, $('copyBtn'), '复制链接'));
  $('copyCodeBtn').addEventListener('click', () => copyText($('roomCode').textContent, $('copyCodeBtn'), '复制房间码'));

  // 系统分享（手机上直接调起分享面板；不支持则隐藏）
  if (navigator.share) {
    $('shareBtn').classList.remove('hidden');
    $('shareBtn').addEventListener('click', () => {
      navigator.share({
        title: '井字棋 · 在线对战',
        text: `来和我下一局井字棋！房间码 ${$('roomCode').textContent}`,
        url: $('shareLink').value,
      }).catch(() => {});
    });
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  const rematchRound = () => {
    if (seriesEnded) return;                    // 系列赛已结束 → 只能开新系列
    if (session && session.getState().over) session.rematch();
    $('resultModal').classList.remove('show');
  };
  const seriesRestart = () => {
    if (!session || !session.getState().over) return;
    if (conn && conn.open) conn.send({ type: 'series-reset' });
    resetSeriesScores();
    session.rematch();
    $('resultModal').classList.remove('show');
  };
  $('rematchBtn').addEventListener('click', rematchRound);
  $('modalAgain').addEventListener('click', () => (seriesEnded ? seriesRestart() : rematchRound()));
  $('modalClose').addEventListener('click', () => $('resultModal').classList.remove('show'));

  // 关页面时尽快通知对方并释放房间
  window.addEventListener('beforeunload', () => {
    try { if (conn) conn.close(); } catch (e) {}
    try { if (peer) peer.destroy(); } catch (e) {}
  });

  /* ---------- 通过 ?room=XXXX 链接直达 ---------- */
  const params = new URLSearchParams(location.search);
  const roomParam = (params.get('room') || '').toUpperCase();
  if (CODE_RE.test(roomParam)) {
    $('codeInput').value = roomParam;
    joinRoom(roomParam);
  }
})();
</script>
</body>
</html>
